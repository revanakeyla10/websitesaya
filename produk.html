<!DOCTYPE html>
<html lang="id">
<head>
  <title>.:PRODUK YANG TERSEDIA:.</title>
</head>

<body>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Foto Interaktif</title>
    <style>
body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        /* Mengatur tata letak grid untuk katalog */
        .katalog-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Desain kartu produk */
        .item-katalog {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
            text-align: center;
            padding-bottom: 15px;
        }
        .item-katalog:hover {
            transform: translateY(-5px); /* Efek melayang saat kursor mendekat */
        }
        .item-katalog img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Agar gambar tidak gepeng */
        }
        .item-katalog p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #555;
        }
        .item-katalog a {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h2>Katalog Produk Pilihan</h2>

    <div class="katalog-container">
        
        <!-- Item 1 -->
        <div class="item 1">
            <a href="https://www.tokopedia.com" target="_blank">
                <img src="https://via.placeholder.com/300x200" alt="Produk A">
                <p>Produk A - Beli Disini</p>
            </a>
        </div>

        <!-- Item 2 -->
        <div class="item-katalog">
            <a href="https://www.shopee.co.id" target="_blank">
                <img src="https://via.placeholder.com/300x200" alt="Produk B">
                <p>Produk B - Beli Disini</p>
            </a>
        </div>

        <!-- Item 3 -->
        <div class="item-katalog">
            <a href="https://wa.me/6281234567890" target="_blank">
                <img src="https://via.placeholder.com/300x200" alt="Produk C">
                <p>Produk C - Chat WhatsApp</p>
            </a>
        </div>

    </div>

</body>
</html>
