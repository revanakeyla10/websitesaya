<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Foto Interaktif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:#3E2723;
            padding: 20px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        /* Mengatur tata letak grid untuk katalog */
        .katalog-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        /* Desain kartu produk */
        .item-katalog {
            background: #F4C9D6;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
            text-align: center;
            padding-bottom: 15px;
        }
        .item-katalog:hover {
            transform: translateY(-5px); /* Efek melayang saat kursor mendekat */
        }
        .item-katalog img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* Agar gambar tidak gepeng */
        }
        .item-katalog p {
            margin: 10px 0 0;
            font-weight: bold;
            color: #555;
        }
        .item-katalog a {
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="katalog-container">
        
        <!-- Item 1 -->
        <div class="item-katalog">
            <a href="https://share.google/CeONC8PBjm1R1mft8" target="_blank">
